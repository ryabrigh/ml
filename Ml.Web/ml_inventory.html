<!DOCTYPE html>
<html lang="en"><title>MLAdmin-Product</title>
<meta name="viewport" content="width=device-width" />
	<head>
		<script src="jquery-3.6.1.js"></script>
		<script src="ml_inventory.js"></script>
		<link rel="stylesheet" href="css/site.css">
		<link rel="stylesheet" href="css/bootstrap.min.css">
		<link rel="stylesheet" href="css/font-awesome.min.css">
	</head>
	<body>
		<h1 class="mlH1">ML Inventory</h1><a href="index.html" style="padding-left:10px">Back to index</a>
		<form class="form-horizontal col-xs-12" style="padding-top: 2%" >
			<div class="form-group col-xs-12">
				<label class="control-label col-sm-2" for="inventoryDate">Last Inventory Date:</label>
				<div class="col-sm-2">
				  <input type="text" class="form-control" id="inventoryDate" >
				</div>
				<div class="col-sm-8"></div>
			  </div>
			</div>
			<div class="form-group col-xs-12">
			  <div class="col-sm-offset-2 col-sm-10">
				<button class="btn btn-primary" onclick="UpdateInventoryDate()" type="button">Update Inventory Date</button>
			  </div>
			</div>
		  </form>
		<div class="form-group col-xs-12">
			<label hidden="true" id="sortField">name_asc</label>
			<div class="col-sm-2 col-xs-7">
				<button class="btn btn-primary" onclick="ReviseInventoryFromDate()" type="button" >Revise Inventory From Date</button>
			</div>
			<div class="col-sm-1 col-xs-3">
				<button class="btn btn-primary" onclick="Submit()" type="button" style="background-color:green">Submit Amounts</button>
			</div>
		</div>
		<div id="dataTable" class="col-xs-12" style="padding: 10px"></div>
		<div class="modal"><!-- Place at bottom of page --></div>
	</body>
</html>
