<!DOCTYPE html>
<html lang="en"><title>MLShopLists</title>
<meta name="viewport" content="width=device-width" />
<head>
	<script src="jquery-3.6.1.js"></script>
	<script src="ml_shared.js"></script>
	<script src="ml_shoplist.js"></script>
	<link rel="stylesheet" href="css/site.css">
	<link rel="stylesheet" href="css/bootstrap.min.css">
</head>
	<body>
		<h1 class="mlH1">ML Shopping Lists</h1><a href="index.html" style="padding-left:10px">Back to index</a>
		<form class="form-horizontal col-sm-12" style="padding-top: 2%" >
			<div class="form-group">
			  <label class="control-label col-sm-1" for="shopListId">ID:</label>
			  <div class="col-sm-3">
				<input type="text" class="form-control" id="shopListId" readonly="true" >
			  </div>
			  <div class="col-sm-1">
				<button class="btn btn-primary" onclick="Clear()" type="button">Clear Edit Fields</button>
			  </div>
			  <div class="col-sm-7"></div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-1" for="shopListDate">Date:</label>
				<div class="col-sm-3">
				  <input type="text" class="form-control" id="shopListDate" >
				</div>
				<div class="col-sm-8"></div>
			  </div>
				<div class="form-group">
			  <div class="col-sm-offset-1 col-sm-11">
				<div class="checkbox">
				  <label><input type="checkbox" id="shopListActive"> Active</label>
				</div>
			  </div>
			</div>
			<div class="form-group">
			  <div class="col-sm-offset-1 col-sm-11">
				<button class="btn btn-primary" onclick="AddEdit()" type="button">Save Data</button>
			  </div>
			</div>
		  </form>
		<hr>
		<div class="checkbox" style="padding-left: 10px">
			<label><input type="checkbox" id="showInactive" onclick="GetAll()"> Show Inactive</label>
		</div>
		<div id="dataTable" class="col-sm-12" style="padding: 10px"></div>
		<div class="modal"><!-- Place at bottom of page --></div>
	</body>
</html>
